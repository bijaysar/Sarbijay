<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bijay Chalise | Bij_sar Software Industries</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #030303;
            --text-white: #ffffff;
            --primary-blue: #007BFF;
            --accent-red: #FF3B3F;
            --whatsapp-green: #25D366;
            --secondary-gray: #0d0d0d;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
            width: 100%;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 90%);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(3, 3, 3, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo { font-weight: 900; font-size: 1.1rem; letter-spacing: -1px; }
        .logo span { color: var(--accent-red); }

        .social-nav { display: flex; gap: 1.2rem; }
        .social-nav a { font-size: 1.1rem; color: white; opacity: 0.8; text-decoration: none; }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 120px 8% 60px;
            gap: 40px;
        }

        .hero-content { flex: 1; z-index: 2; }
        .hero-content h2 { color: var(--accent-red); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 0.5rem; }
        
        .hero-content h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 0.95;
            font-weight: 900;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        .gradient-text {
            background: linear-gradient(45deg, #fff, #777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p { font-size: 1rem; color: #888; margin-bottom: 2.5rem; border-left: 2px solid var(--accent-red); padding-left: 1rem; max-width: 500px; }

        /* --- High-Scale Responsive Image --- */
        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            perspective: 1000px;
        }

        .photo-frame {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4/5;
            background: #111;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: 0.5s ease;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.4); 
            object-position: center 42%;
            filter: grayscale(100%);
            transition: 0.8s;
        }

        .photo-frame:hover img { filter: grayscale(0%); transform: scale(1.35); }

        .btn-group { display: flex; flex-wrap: wrap; gap: 1rem; }
        
        .btn {
            padding: 1rem 2rem;
            text-decoration: none;
            font-weight: 800;
            border-radius: 12px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            min-width: 160px;
        }
        
        .btn-red { background: var(--accent-red); color: white; box-shadow: 0 8px 20px rgba(255, 59, 63, 0.2); }
        .btn-outline { border: 1px solid var(--glass-border); color: white; background: rgba(255,255,255,0.05); }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: var(--whatsapp-green);
            color: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 2000;
            text-decoration: none;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 0 5% 5rem;
        }

        .stat-card {
            background: var(--secondary-gray);
            padding: 2rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .stat-card h3 { font-size: 2rem; font-weight: 900; margin-bottom: 0.3rem; }
        .stat-card p { color: #666; font-size: 0.7rem; text-transform: uppercase; font-weight: 700; }

        /* --- Android/Mobile Specific Adjustments --- */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 100px;
            }
            
            .hero-content p {
                margin: 0 auto 2.5rem;
                border-left: none;
                border-top: 2px solid var(--accent-red);
                padding-top: 1rem;
                padding-left: 0;
            }

            .hero-image-container {
                order: -1; /* Image comes first on mobile */
                width: 100%;
            }

            .photo-frame {
                max-width: 280px;
                margin: 0 auto;
            }

            .stats-bar {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .logo { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <a href="https://wa.me/9846642239" class="whatsapp-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <nav>
        <div class="logo">BIJ_SAR<span>.IND</span></div>
        <div class="social-nav">
            <a href="https://www.facebook.com/bijay.chalise.2025" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://instagram.com/chalise_bijay" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://wa.me/9846642239" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-image-container">
            <div class="photo-frame">
                <img src="https://i.ibb.co/0jwxyt9P/Whats-App-Image-2026-05-07-at-5-44-26-PM.jpg" alt="Bijay Chalise">
            </div>
        </div>

        <div class="hero-content">
            <h2>Software Architect</h2>
            <h1>Bijay <span class="gradient-text">Chalise</span></h1>
            <p>Founder of <b>Bij_sar Software Industries</b>. We engineer high-performance software and bold digital ecosystems.</p>
            <div class="btn-group">
                <a href="https://wa.me/9846642239" class="btn btn-red">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </a>
                <a href="#" class="btn btn-outline">Projects</a>
            </div>
        </div>
    </section>

    <section class="stats-bar">
        <div class="stat-card">
            <h3 style="color: var(--primary-blue)">3+</h3>
            <p>Years Experience</p>
        </div>
        <div class="stat-card">
            <h3 style="color: var(--accent-red)">70+</h3>
            <p>Clients</p>
        </div>
        <div class="stat-card">
            <h3 style="color: var(--primary-blue)">24/7</h3>
            <p>Support</p>
        </div>
    </section>

</body>
</html>
