<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijay Chalise | Bij_sar Software Industries</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #030303;
            --text-white: #ffffff;
            --primary-blue: #007BFF;
            --accent-red: #FF3B3F;
            --whatsapp-green: #25D366;
            --secondary-gray: #0d0d0d;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(3, 3, 3, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: -1px; }
        .logo span { color: var(--accent-red); text-shadow: 0 0 20px var(--accent-red); }

        .nav-links { display: flex; align-items: center; }
        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            opacity: 0.6;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .nav-links a:hover { opacity: 1; color: var(--accent-red); }

        .social-nav { margin-left: 3rem; display: flex; gap: 1.5rem; border-left: 1px solid var(--glass-border); padding-left: 2rem; }
        .social-nav a { font-size: 1.2rem; opacity: 0.8; transition: 0.4s; color: white; }
        .social-nav a:hover { transform: translateY(-3px); color: var(--whatsapp-green); }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .hero-content { flex: 1; max-width: 650px; }
        .hero-content h2 { color: var(--accent-red); font-size: 1rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 1rem; }
        .hero-content h1 {
            font-size: 5.5rem;
            line-height: 0.95;
            font-weight: 900;
            margin-bottom: 2rem;
            letter-spacing: -3px;
        }

        .gradient-text {
            background: linear-gradient(45deg, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p { font-size: 1.1rem; color: #888; margin-bottom: 3rem; border-left: 2px solid var(--accent-red); padding-left: 1.5rem; }

        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            perspective: 1000px;
        }

        .photo-frame {
            position: relative;
            width: 440px;
            height: 560px;
            background: #111;
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transform: rotateY(-10deg);
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: -20px 20px 50px rgba(0,0,0,0.8);
        }

        .photo-frame:hover { transform: rotateY(0deg) translateY(-10px); border-color: var(--primary-blue); }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.4); 
            object-position: center 42%;
            filter: grayscale(100%);
            transition: 0.8s;
        }

        .photo-frame:hover img { filter: grayscale(0%); transform: scale(1.3); }

        .btn-group { display: flex; gap: 1rem; }
        .btn {
            padding: 1.2rem 2.5rem;
            text-decoration: none;
            font-weight: 800;
            border-radius: 12px;
            transition: 0.4s;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-red { background: var(--accent-red); color: white; box-shadow: 0 10px 30px rgba(255, 59, 63, 0.3); }
        .btn-red:hover { transform: scale(1.05); background: white; color: black; }
        .btn-outline { border: 1px solid var(--glass-border); color: white; backdrop-filter: blur(10px); }

        /* --- Floating WhatsApp Button --- */
        .whatsapp-float {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background-color: var(--whatsapp-green);
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            animation: pulse-green 2s infinite;
            transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); background-color: #1ebe57; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            padding: 0 8% 5rem;
        }

        .stat-card {
            background: var(--secondary-gray);
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        @media (max-width: 1100px) {
            .hero { flex-direction: column; text-align: center; height: auto; padding: 150px 8% 80px; }
            .photo-frame { width: 300px; height: 400px; transform: none; margin-top: 4rem; }
            .stats-bar { grid-template-columns: 1fr; }
            .whatsapp-float { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 25px; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <a href="https://wa.me/9846642239" class="whatsapp-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <nav>
        <div class="logo">BIJ_SAR<span>.INDUSTRIES</span></div>
        <div class="nav-links">
            <a href="#">Projects</a>
            <a href="#">Experience</a>
            <div class="social-nav">
                <a href="https://www.facebook.com/bijay.chalise.2025" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://instagram.com/chalise_bijay" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://wa.me/9846642239" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2>Lead Software Architect</h2>
            <h1>Bijay <span class="gradient-text">Chalise</span></h1>
            <p>Founder of <b>Bij_sar Software Industries</b>. Delivering high-scale digital solutions and aggressive software architecture.</p>
            <div class="btn-group">
                <a href="https://wa.me/9846642239" class="btn btn-red">
                    <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
                </a>
                <a href="#" class="btn btn-outline">Explore Labs</a>
            </div>
        </div>

        <div class="hero-image-container">
            <div class="photo-frame">
                <img src="https://i.ibb.co/0jwxyt9P/Whats-App-Image-2026-05-07-at-5-44-26-PM.jpg" alt="Bijay Chalise">
            </div>
        </div>
    </section>

    <section class="stats-bar">
        <div class="stat-card">
            <h3 style="color: var(--primary-blue)">3+</h3>
            <p>Years in Industry</p>
        </div>
        <div class="stat-card">
            <h3 style="color: var(--accent-red)">70+</h3>
            <p>Deployments</p>
        </div>
        <div class="stat-card">
            <h3 style="color: var(--primary-blue)">24/7</h3>
            <p>Tech Support</p>
        </div>
    </section>

</body>
</html>
