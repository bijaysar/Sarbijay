<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo – 2 Player</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    background: #1a2a32; margin: 0; min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', sans-serif; padding: 12px;
  }
  .wrap {
    background: #0f1a1f; border-radius: 24px; padding: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,.6);
    max-width: 640px; width: 100%;
  }
  h1 { color: #fff; margin: 0 0 12px; text-align: center; font-size: 1.6rem; letter-spacing: 3px; }
  .status {
    color: #fff; text-align: center; font-size: 1.1rem; font-weight: 600;
    margin-bottom: 12px; padding: 10px; background: #243b44; border-radius: 30px;
  }
  .dot { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  canvas { display:block; width:100%; height:auto; border-radius:16px; background:#1e2f38; cursor:pointer; }
  .bar { display:flex; gap:14px; align-items:center; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .dice {
    width:64px; height:64px; background:#f5f5f5; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:2.6rem;
    font-weight:700; color:#111; box-shadow: 0 4px 0 #999;
  }
  .dice.rolling { animation: shake .12s infinite; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(8deg)} 75%{transform:rotate(-8deg)} }
  button {
    border:none; border-radius:40px; padding:16px 28px; font-size:1rem;
    font-weight:700; cursor:pointer; transition:.08s; text-transform:uppercase; letter-spacing:1px;
  }
  .roll { background:#e1b12c; color:#10181d; box-shadow:0 6px 0 #9e7e1f; }
  .roll:active:not(:disabled) { transform:translateY(4px); box-shadow:0 2px 0 #9e7e1f; }
  .roll:disabled { opacity:.4; pointer-events:none; }
  .reset { background:#3f5e6b; color:#fff; box-shadow:0 6px 0 #1d2f37; }
  .reset:active { transform:translateY(4px); box-shadow:0 2px 0 #1d2f37; }
  .hint { color:#8fa8b3; text-align:center; font-size:.82rem; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LUDO</h1>
  <div class="status" id="status"><span class="dot" id="dot" style="background:#e74c3c"></span><span id="statusText">Red's turn — roll the dice</span></div>
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="bar">
    <div class="dice" id="dice">⚀</div>
    <button class="roll" id="rollBtn">Roll</button>
    <button class="reset" id="resetBtn">New Game</button>
  </div>
  <div class="hint" id="hint">Roll a 6 to bring a token out of home.</div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const statusText = document.getElementById('statusText');
  const dot = document.getElementById('dot');
  const diceEl = document.getElementById('dice');
  const rollBtn = document.getElementById('rollBtn');
  const resetBtn = document.getElementById('resetBtn');
  const hintEl = document.getElementById('hint');

  const N = 15;                 // 15x15 grid
  const CELL = cv.width / N;    // 40px
  const MAX_POS = 56;           // final position
  const START = { red: 0, green: 26 };
  const PLAYERS = ['red', 'green'];
  const COLORS = { red: '#e74c3c', green: '#2ecc71' };

  // 52-cell main track (row, col) following the classic Ludo cross
  const TRACK = [
    // Red start: row 6, col 0 → move right along row 6
    {r:6,c:0},{r:6,c:1},{r:6,c:2},{r:6,c:3},{r:6,c:4},{r:6,c:5},
    // up column 6
    {r:5,c:6},{r:4,c:6},{r:3,c:6},{r:2,c:6},{r:1,c:6},{r:0,c:6},
    // across row 0
    {r:0,c:7},{r:0,c:8},
    // down column 8
    {r:1,c:8},{r:2,c:8},{r:3,c:8},{r:4,c:8},{r:5,c:8},
    // right along row 6
    {r:6,c:9},{r:6,c:10},{r:6,c:11},{r:6,c:12},{r:6,c:13},{r:6,c:14},
    // green start: row 8, col 14 → move down then left
    {r:7,c:14},{r:8,c:14},
    // left along row 8
    {r:8,c:13},{r:8,c:12},{r:8,c:11},{r:8,c:10},{r:8,c:9},{r:8,c:8},
    // down column 8
    {r:9,c:8},{r:10,c:8},{r:11,c:8},{r:12,c:8},{r:13,c:8},{r:14,c:8},
    // across row 14
    {r:14,c:7},{r:14,c:6},
    // up column 6
    {r:13,c:6},{r:12,c:6},{r:11,c:6},{r:10,c:6},{r:9,c:6},
    // left along row 8 to red start
    {r:8,c:5},{r:8,c:4},{r:8,c:3},{r:8,c:2},{r:8,c:1},{r:8,c:0}
  ];
  // pad/trim to exactly 52
  while (TRACK.length < 52) TRACK.push({r:6,c:0});
  TRACK.length = 52;

  // home stretch (5 cells each) toward center
  const HOME_RED = [{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5}];
  const HOME_GREEN = [{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9}];

  let tokens = { red: [{pos:-1},{pos:-1}], green: [{pos:-1},{pos:-1}] };
  let current = 0;
  let dice = 1;
  let rolled = false;     // has the current player rolled but not moved yet?
  let busy = false;       // during dice animation
  let winner = null;

  function trackPos(player, idx){  // idx = 0..51 (main track)
    if (player === 'red') return TRACK[idx % 52];
    return TRACK[(idx + 26) % 52];
  }
  function homePos(player, idx){   // idx = 0..4 (home stretch)
    return player === 'red' ? HOME_RED[idx] : HOME_GREEN[idx];
  }
  function cellCenter(rc){ return { x: rc.c*CELL + CELL/2, y: rc.r*CELL + CELL/2 }; }

  // ---------- drawing ----------
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);

    // background grid
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      let col = '#2d4a57';
      if ((r<6&&c<6)||(r<6&&c>8)||(r>8&&c<6)||(r>8&&c>8)) col='#1e353f';
      if ((r>=6&&r<=8&&(c<6||c>8))||(c>=6&&c<=8&&(r<6||r>8))) col='#34606e';
      if (r>=6&&r<=8&&c>=6&&c<=8) col='#3f6f7e';
      ctx.fillStyle = col;
      ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
      ctx.strokeStyle = '#1f3a42'; ctx.lineWidth = 1;
      ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
    }

    // color the start cells
    ctx.fillStyle = COLORS.red;   ctx.fillRect(0*CELL, 6*CELL, CELL, CELL);
    ctx.fillStyle = COLORS.green; ctx.fillRect(14*CELL, 8*CELL, CELL, CELL);

    // home stretch color tint
    HOME_RED.forEach(h=>{ ctx.fillStyle='#e74c3c66'; ctx.fillRect(h.c*CELL,h.r*CELL,CELL,CELL); });
    HOME_GREEN.forEach(h=>{ ctx.fillStyle='#2ecc7166'; ctx.fillRect(h.c*CELL,h.r*CELL,CELL,CELL); });

    // center triangle-ish
    ctx.fillStyle = '#ffd966'; ctx.font='bold 28px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('★', cv.width/2, cv.height/2);

    // draw home yard tokens (not on board)
    drawYard('red', 1, 1);
    drawYard('green', 9, 9);

    // draw tokens on track & home
    PLAYERS.forEach(p=>{
      tokens[p].forEach((t, i)=>{
        if (t.pos === -1) return; // yard drawn separately
        let rc;
        if (t.pos < 52) rc = trackPos(p, t.pos);
        else rc = homePos(p, t.pos - 52);
        const {x,y} = cellCenter(rc);
        drawToken(x, y, p, i, t.pos === MAX_POS);
      });
    });

    // highlight movable tokens
    if (rolled && !winner && !busy){
      const movable = getMovable();
      movable.forEach(i=>{
        const p = PLAYERS[current];
        const t = tokens[p][i];
        let rc;
        if (t.pos === -1){
          const base = p==='red' ? {r:1,c:1} : {r:10,c:10};
          const off = i===0 ? {r:1,c:1} : {r:3,c:3};
          rc = {r:base.r+off.r, c:base.c+off.c};
        } else if (t.pos < 52) rc = trackPos(p, t.pos);
        else rc = homePos(p, t.pos - 52);
        const {x,y} = cellCenter(rc);
        ctx.beginPath();
        ctx.arc(x,y, CELL*0.48, 0, Math.PI*2);
        ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 4;
        ctx.stroke();
      });
    }
  }

  function drawYard(player, baseR, baseC){
    const color = COLORS[player];
    tokens[player].forEach((t, i)=>{
      if (t.pos !== -1) return;
      const off = i===0 ? {r:1,c:1} : {r:3,c:3};
      const rc = {r: baseR+off.r, c: baseC+off.c};
      const {x,y} = cellCenter(rc);
      drawToken(x, y, player, i, false);
    });
  }

  function drawToken(x, y, player, idx, finished){
    ctx.beginPath();
    ctx.arc(x, y, CELL*0.36, 0, Math.PI*2);
    ctx.fillStyle = COLORS[player];
    ctx.shadowColor = COLORS[player];
    ctx.shadowBlur = finished ? 25 : 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(idx+1, x, y);
  }

  // ---------- game logic ----------
  function canMove(i){
    if (winner) return false;
    const p = PLAYERS[current];
    const t = tokens[p][i];
    if (t.pos === MAX_POS) return false;
    if (t.pos === -1) return dice === 6;
    return t.pos + dice <= MAX_POS;
  }
  function getMovable(){
    const out = [];
    for (let i=0;i<2;i++) if (canMove(i)) out.push(i);
    return out;
  }

  function doMove(i){
    if (!rolled || winner || busy) return;
    const p = PLAYERS[current];
    const t = tokens[p][i];
    if (!canMove(i)) return;

    if (t.pos === -1) t.pos = START[p];
    else t.pos += dice;

    // check win
    if (tokens[p].every(x=>x.pos === MAX_POS)){
      winner = p;
      rolled = false;
      updateUI();
      draw();
      return;
    }

    // pass turn
    current = (current+1)%2;
    rolled = false;
    dice = 1;
    setDiceFace(1);
    updateUI();
    draw();
  }

  function rollDice(){
    if (rolled || winner || busy) return;
    busy = true;
    rollBtn.disabled = true;
    diceEl.classList.add('rolling');
    let count = 0;
    const iv = setInterval(()=>{
      setDiceFace(Math.floor(Math.random()*6)+1);
      count++;
      if (count > 7){
        clearInterval(iv);
        diceEl.classList.remove('rolling');
        dice = Math.floor(Math.random()*6)+1;
        setDiceFace(dice);
        rolled = true;
        busy = false;

        const movable = getMovable();
        if (movable.length === 0){
          // no moves — auto-pass after brief pause
          hintEl.innerText = `Rolled ${dice}. No moves available — passing turn…`;
          setTimeout(()=>{
            if (rolled && !winner){
              current = (current+1)%2;
              rolled = false;
              dice = 1;
              setDiceFace(1);
              updateUI();
              draw();
            }
          }, 700);
        } else if (movable.length === 1){
          // auto-move if only one option
          hintEl.innerText = `Rolled ${dice}. Moving…`;
          setTimeout(()=>doMove(movable[0]), 350);
        } else {
          hintEl.innerText = `Rolled ${dice}. Click a highlighted token to move.`;
          rollBtn.disabled = true;
        }
        draw();
      }
    }, 60);
  }

  function setDiceFace(v){
    diceEl.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][v-1];
  }

  function updateUI(){
    if (winner){
      statusText.innerText = `${winner.toUpperCase()} WINS!`;
      dot.style.background = '#f1c40f';
      rollBtn.disabled = true;
      hintEl.innerText = 'Click "New Game" to play again.';
      return;
    }
    statusText.innerText = `${PLAYERS[current].charAt(0).toUpperCase()+PLAYERS[current].slice(1)}'s turn — roll the dice`;
    dot.style.background = COLORS[PLAYERS[current]];
    rollBtn.disabled = rolled || busy;
    if (!rolled){
      hintEl.innerText = 'Roll the dice. A 6 brings a token out of home.';
    }
  }

  // ---------- input ----------
  cv.addEventListener('click', (e)=>{
    if (!rolled || winner || busy) return;
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (cv.width/r.width);
    const my = (e.clientY - r.top) * (cv.height/r.height);
    const movable = getMovable();
    const p = PLAYERS[current];

    for (const i of movable){
      const t = tokens[p][i];
      let rc;
      if (t.pos === -1){
        const base = p==='red' ? {r:1,c:1} : {r:10,c:10};
        const off = i===0 ? {r:1,c:1} : {r:3,c:3};
        rc = {r:base.r+off.r, c:base.c+off.c};
      } else if (t.pos < 52) rc = trackPos(p, t.pos);
      else rc = homePos(p, t.pos-52);
      const {x,y} = cellCenter(rc);
      if (Math.hypot(mx-x, my-y) < CELL*0.7){
        doMove(i);
        return;
      }
    }
  });

  rollBtn.addEventListener('click', rollDice);

  resetBtn.addEventListener('click', ()=>{
    tokens = { red:[{pos:-1},{pos:-1}], green:[{pos:-1},{pos:-1}] };
    current = 0; dice = 1; rolled = false; busy = false; winner = null;
    diceEl.classList.remove('rolling');
    setDiceFace(1);
    updateUI();
    draw();
  });

  // init
  setDiceFace(1);
  updateUI();
  draw();
})();
</script>
</body>
</html>
